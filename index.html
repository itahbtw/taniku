      // ============ RENDER: LAPORAN ============
      function renderLaporan() {
        const allMusim = state.data.musimTanam.filter((m) =>
          getLahanList().some((l) => l.id === m.lahanId),
        );
        const el = document.getElementById("laporanPrintArea");
        if (allMusim.length === 0) {
          el.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">Belum ada musim tanam untuk dilaporkan.</div></div>`;
          return;
        }
        const selectedId = el._selectedMusimId || allMusim[0].id;
        const musim = allMusim.find((m) => m.id === selectedId) || allMusim[0];
        const lahan = getLahanById(musim.lahanId);
        const { biaya, pendapatan, laba } = hitungLabaRugi(musim.id);
        const aktivitas = getAktivitasForMusim(musim.id);
        const panen = getPanenForMusim(musim.id);

        const biayaByKat = {};
        aktivitas.forEach((a) => {
          biayaByKat[a.kategori] = (biayaByKat[a.kategori] || 0) + a.nominal;
        });

        el._selectedMusimId = musim.id;

        el.innerHTML = `
    <div class="card">
      <div class="form-group no-print">
        <label class="form-label">Pilih Musim Tanam</label>
        <select class="form-select" onchange="document.getElementById('laporanPrintArea')._selectedMusimId = parseInt(this.value); renderLaporan();">
          ${allMusim
            .map((m) => {
              const l = getLahanById(m.lahanId);
              return `<option value="${m.id}" ${m.id === musim.id ? "selected" : ""}>${escapeHtml(m.komoditas)} · ${l ? escapeHtml(l.nama) : "-"} (${m.status === "aktif" ? "Aktif" : "Selesai"})</option>`;
            })
            .join("")}
        </select>
      </div>

      <div style="text-align:center; padding:12px 0; border-bottom:2px solid var(--text); margin-bottom:14px;">
        <div style="font-size:18px; font-weight:700;">LAPORAN LABA-RUGI</div>
        <div style="font-size:14px; font-weight:600; margin-top:4px;">${escapeHtml(musim.komoditas)} · ${lahan ? escapeHtml(lahan.nama) : "-"}</div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">
          Musim ${escapeHtml(String(musim.tglMulai).substring(0, 4))} · ${formatTanggal(musim.tglMulai)} s.d. ${musim.tglSelesai ? formatTanggal(musim.tglSelesai) : "sekarang"}
        </div>
      </div>

      <div class="laporan-section">
        <div style="font-weight:700; font-size:13px; text-transform:uppercase; color:var(--primary); margin-bottom:8px;">Pendapatan</div>
        ${
          panen.length === 0
            ? `<div class="laporan-row"><span class="label" style="color:var(--text-muted);">Belum ada penjualan</span><span class="value">Rp 0</span></div>`
            : panen
                .map(
                  (p) =>
                    `<div class="laporan-row"><span class="label">${escapeHtml(p.pembeli)} (${p.kuantitas.toLocaleString("id-ID")} ${escapeHtml(p.satuan)})</span><span class="value">${formatRupiah(p.kuantitas * p.hargaSatuan)}</span></div>`,
                )
                .join("")
        }
        <div class="laporan-row total"><span class="label">Total Pendapatan</span><span class="value" style="color:var(--success);">${formatRupiah(pendapatan)}</span></div>
      </div>

      <div class="laporan-section">
        <div style="font-weight:700; font-size:13px; text-transform:uppercase; color:var(--primary); margin-bottom:8px;">Biaya Produksi</div>
        ${
          Object.keys(biayaByKat).length === 0
            ? `<div class="laporan-row"><span class="label" style="color:var(--text-muted);">Belum ada biaya</span><span class="value">Rp 0</span></div>`
            : Object.entries(biayaByKat)
                .map(
                  ([kat, val]) =>
                    `<div class="laporan-row"><span class="label">${escapeHtml(kat)}</span><span class="value">${formatRupiah(val)}</span></div>`,
                )
                .join("")
        }
        <div class="laporan-row total"><span class="label">Total Biaya</span><span class="value" style="color:var(--danger);">${formatRupiah(biaya)}</span></div>
      </div>

      <div class="laba-box ${laba < 0 ? "rugi" : ""}">
        <div class="laba-label">${laba >= 0 ? "Laba Bersih" : "Rugi"}</div>
        <div class="laba-value">${formatRupiah(laba)}</div>
      </div>

      <div class="card no-print" style="margin-top:16px;">
        <div class="card-title">Grafik Biaya per Kategori</div>
        <canvas id="biayaChart" height="220"></canvas>
      </div>
      <div class="card no-print" style="margin-top:12px;">
        <div class="card-title">Perbandingan Pendapatan vs Biaya</div>
        <canvas id="pendapatanChart" height="180"></canvas>
      </div>

      <div style="text-align:center; font-size:11px; color:var(--text-muted); margin-top:16px; padding-top:12px; border-top:1px dashed var(--border);">
        Dicetak: ${new Date().toLocaleString("id-ID")}
      </div>
    </div>`;
        renderLaporanCharts(biayaByKat, pendapatan, biaya);
      }

      let chartLoadCallbacks = [];
      function ensureChart(callback) {
        if (typeof Chart !== "undefined") {
          callback();
          return;
        }
        chartLoadCallbacks.push(callback);
        if (window.__tanikuChartLoading) return;
        window.__tanikuChartLoading = true;
        const script = document.createElement("script");
        script.src = "chart.umd.min.js";
        script.onload = () => {
          window.__tanikuChartLoading = false;
          const queue = chartLoadCallbacks;
          chartLoadCallbacks = [];
          queue.forEach((fn) => fn());
        };
        script.onerror = () => {
          window.__tanikuChartLoading = false;
          chartLoadCallbacks = [];
        };
        document.head.appendChild(script);
      }

      function renderLaporanCharts(biayaByKat, pendapatan, biaya) {
        ensureChart(() => {
          if (typeof Chart === "undefined") return;
          const labels = Object.keys(biayaByKat);
          const data = Object.values(biayaByKat);
          const colors = [
            "#2e7d32",
            "#66bb6a",
            "#f57c00",
            "#d32f2f",
            "#388e3c",
            "#1b5e20",
            "#757575",
          ];
          const c1 = document.getElementById("biayaChart");
          if (c1) {
            if (c1._chart) c1._chart.destroy();
            c1._chart = new Chart(c1, {
              type: "doughnut",
              data: {
                labels,
                datasets: [
                  { data, backgroundColor: colors.slice(0, labels.length) },
                ],
              },
              options: {
                plugins: { legend: { position: "bottom" } },
                cutout: "60%",
              },
            });
          }
          const c2 = document.getElementById("pendapatanChart");
          if (c2) {
            if (c2._chart) c2._chart.destroy();
            c2._chart = new Chart(c2, {
              type: "bar",
              data: {
                labels: ["Pendapatan", "Biaya"],
                datasets: [
                  {
                    data: [pendapatan, biaya],
                    backgroundColor: ["#388e3c", "#d32f2f"],
                  },
                ],
              },
              options: {
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } },
              },
            });
          }
        });
      }

      // ============ MODAL SYSTEM ============
      function openModal(title, contentHTML) {
        const overlay = document.getElementById("modalOverlay");
        const modal = document.getElementById("modalContent");
        modal.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">${title}</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    ${contentHTML}`;
        overlay.classList.remove("hidden");
        document.body.style.overflow = "hidden";
      }
      function closeModal() {
        document.getElementById("modalOverlay").classList.add("hidden");
        document.body.style.overflow = "";
        window.__confirmCallback = null;
      }
      function confirmAction(opts) {
        window.__confirmCallback = opts.onConfirm;
        openModal(
          escapeHtml(opts.title || "Konfirmasi"),
          `
    <div class="confirm-message">${escapeHtml(opts.message)}</div>
    <div class="confirm-actions">
      <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeModal()">${escapeHtml(opts.cancelText || "Batal")}</button>
      <button type="button" class="btn ${opts.danger === false ? "btn-primary" : "btn-danger"}" style="flex:1;" onclick="jalankanKonfirmasi()">${escapeHtml(opts.confirmText || "Ya, Lanjutkan")}</button>
    </div>`,
        );
      }
      function jalankanKonfirmasi() {
        const cb = window.__confirmCallback;
        window.__confirmCallback = null;
        closeModal();
        if (typeof cb === "function") cb();
      }

      document.getElementById("modalOverlay").addEventListener("click", (e) => {
        if (e.target.id === "modalOverlay") closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      // ============ MODAL: LAHAN ============
      function openLahanModal(editId = null) {
        const l = editId ? getLahanById(editId) : null;
        openModal(
          l ? "Edit Lahan" : "Tambah Lahan",
          `
    <form onsubmit="saveLahan(event, ${editId || "null"})">
      <div class="form-group">
        <label class="form-label">Nama Lahan *</label>
        <input class="form-input" name="nama" required value="${l ? escapeHtml(l.nama) : ""}" placeholder="Contoh: Kebun Cabai Wonorejo">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Luas (m²) *</label>
          <input class="form-input" name="luas" type="number" inputmode="numeric" min="1" step="1" required value="${l ? l.luas : ""}" placeholder="1000">
        </div>
        <div class="form-group">
          <label class="form-label">Lokasi *</label>
          <input class="form-input" name="lokasi" required value="${l ? escapeHtml(l.lokasi) : ""}" placeholder="Desa, Kec.">
        </div>
      </div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeModal()">Batal</button>
        <button type="submit" class="btn btn-primary" style="flex:1;">Simpan</button>
      </div>
    </form>`,
        );
      }
      function saveLahan(e, editId) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = {
          nama: fd.get("nama").trim(),
          luas: parseFloat(fd.get("luas")),
          lokasi: fd.get("lokasi").trim(),
        };
        if (!data.nama || !data.luas || data.luas <= 0 || !data.lokasi) {
          showToast("Lengkapi data dengan benar", "error");
          return;
        }
        if (editId) {
          Object.assign(getLahanById(editId), data);
          showToast("Lahan diperbarui", "success");
        } else {
          state.data.lahan.push({ id: nextId("lahan"), ...data });
          showToast("Lahan ditambahkan", "success");
        }
        saveData();
        closeModal();
        renderLahan();
        renderHome();
      }
      function editLahan(id) {
        openLahanModal(id);
      }
      function deleteLahan(id) {
        const lahan = getLahanById(id);
        if (!lahan) return;
        const musimList = state.data.musimTanam.filter((m) => m.lahanId === id);
        const musimAktif = musimList.find((m) => m.status === "aktif");
        if (musimAktif) {
          showToast(
            "Tidak bisa hapus: tutup musim tanam aktif terlebih dahulu",
            "error",
          );
          return;
        }

        const musimIds = musimList.map((m) => m.id);
        const jmlAktivitas = state.data.aktivitas.filter((a) =>
          musimIds.includes(a.musimId),
        ).length;
        const jmlPanen = state.data.panen.filter((p) =>
          musimIds.includes(p.musimId),
        ).length;
        const ikutan = [];
        if (musimList.length) ikutan.push(musimList.length + " musim tanam");
        if (jmlAktivitas) ikutan.push(jmlAktivitas + " aktivitas");
        if (jmlPanen) ikutan.push(jmlPanen + " data panen");
        const pesan = ikutan.length
          ? 'Hapus lahan "' +
            lahan.nama +
            '" beserta ' +
            ikutan.join(", ") +
            "? Tindakan ini tidak bisa dibatalkan."
          : 'Hapus lahan "' +
            lahan.nama +
            '"? Tindakan ini tidak bisa dibatalkan.';

        confirmAction({
          title: "Hapus Lahan?",
          message: pesan,
          confirmText: "Hapus Lahan",
          onConfirm() {
            state.data.musimTanam = state.data.musimTanam.filter(
              (m) => m.lahanId !== id,
            );
            state.data.aktivitas = state.data.aktivitas.filter(
              (a) => !musimIds.includes(a.musimId),
            );
            state.data.panen = state.data.panen.filter(
              (p) => !musimIds.includes(p.musimId),
            );
            state.data.lahan = state.data.lahan.filter((l) => l.id !== id);
            resetSelectedMusim(musimIds);
            saveData();
            renderHome();
            renderLahan();
            renderAktivitas();
            renderPanen();
            renderLaporan();
            showToast("Lahan dihapus", "success");
          },
        });
      }

      // ============ MODAL: MUSIM ============
      function openMusimModal(lahanId) {
        const l = getLahanById(lahanId);
        if (!l) return;
        openModal(
          "Buat Musim Tanam",
          `
    <form onsubmit="saveMusim(event, ${lahanId})">
      <div class="form-group">
        <label class="form-label">Lahan</label>
        <input class="form-input" value="${escapeHtml(l.nama)}" disabled>
      </div>
      <div class="form-group">
        <label class="form-label">Komoditas *</label>
        <input class="form-input" name="komoditas" required placeholder="Contoh: Cabai" list="komoditasList">
        <datalist id="komoditasList">
          <option value="Padi"><option value="Jagung"><option value="Kedelai"><option value="Cabai"><option value="Tomat"><option value="Bawang Merah">
        </datalist>
      </div>
      <div class="form-group">
        <label class="form-label">Tanggal Mulai *</label>
        <input class="form-input" name="tglMulai" type="date" required value="${today()}" max="${today()}">
      </div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeModal()">Batal</button>
        <button type="submit" class="btn btn-primary" style="flex:1;">Simpan</button>
      </div>
    </form>`,
        );
      }
      function saveMusim(e, lahanId) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const komoditas = fd.get("komoditas").trim();
        const tglMulai = fd.get("tglMulai");
        if (!komoditas || !tglMulai) {
          showToast("Lengkapi data", "error");
          return;
        }
        const aktif = state.data.musimTanam.find(
          (m) => m.lahanId === lahanId && m.status === "aktif",
        );
        if (aktif) {
          showToast("Lahan sudah punya musim aktif", "error");
          return;
        }
        state.data.musimTanam.push({
          id: nextId("musimTanam"),
          lahanId,
          komoditas,
          tglMulai,
          tglSelesai: null,
          status: "aktif",
        });
        saveData();
        closeModal();
        renderLahan();
        renderHome();
        showToast("Musim tanam dibuat", "success");
      }
      function closeMusim(id) {
        if (!confirm("Tutup musim tanam ini? Data tetap tersimpan.")) return;
        const m = getMusimById(id);
        m.status = "selesai";
        m.tglSelesai = today();
        resetSelectedMusim([id]);
        saveData();
        renderLahan();
        renderHome();
        showToast("Musim ditutup", "success");
      }

      // ============ MODAL: AKTIVITAS ============
      function openAktivitasModal(editId = null) {
        const a = editId
          ? state.data.aktivitas.find((x) => x.id === editId)
          : null;
        if (editId && !a) {
          showToast("Aktivitas tidak ditemukan", "error");
          return;
        }
        let activeMusimList = state.data.musimTanam.filter(
          (m) =>
            getLahanList().some((l) => l.id === m.lahanId) &&
            m.status === "aktif",
        );
        if (a && !activeMusimList.some((m) => m.id === a.musimId)) {
          const mEdit = getMusimById(a.musimId);
          if (mEdit) activeMusimList = [mEdit, ...activeMusimList];
        }
        if (activeMusimList.length === 0) {
          showToast("Buat musim tanam dulu di menu Lahan", "error");
          return;
        }
        const jenisList = [
          "Pemupukan",
          "Penyiangan",
          "Penyemprotan",
          "Pengairan",
          "Penanaman",
          "Panen",
          "Lainnya",
        ];
        const kategoriList = [
          "Benih",
          "Pupuk",
          "Pestisida",
          "Tenaga kerja",
          "Alat",
          "Transportasi",
          "Lainnya",
        ];
        const selectedJenis = a ? a.jenis : jenisList[0];
        const selectedKategori = a ? a.kategori : kategoriList[0];
        if (a && !jenisList.includes(selectedJenis))
          jenisList.push(selectedJenis);
        if (a && !kategoriList.includes(selectedKategori))
          kategoriList.push(selectedKategori);
        openModal(
          a ? "Edit Aktivitas" : "Catat Aktivitas",
          `
    <form onsubmit="saveAktivitas(event, ${editId || "null"})">
      <div class="form-group">
        <label class="form-label">Lahan & Musim *</label>
        <select class="form-select" name="musimId" required>
          ${activeMusimList
            .map((m) => {
              const l = getLahanById(m.lahanId);
              return `<option value="${m.id}" ${a && a.musimId === m.id ? "selected" : ""}>${escapeHtml(m.komoditas)} · ${l ? escapeHtml(l.nama) : "-"}</option>`;
            })
            .join("")}
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Jenis Aktivitas *</label>
          <select class="form-select" name="jenis" required>
            ${jenisList.map((j) => `<option ${j === selectedJenis ? "selected" : ""}>${escapeHtml(j)}</option>`).join("")}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Tanggal *</label>
          <input class="form-input" name="tanggal" type="date" required value="${a ? a.tanggal : today()}" max="${today()}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Sarana (opsional)</label>
          <input class="form-input" name="sarana" value="${a ? escapeHtml(a.sarana) : ""}" placeholder="Pupuk Urea">
        </div>
        <div class="form-group">
          <label class="form-label">Jumlah</label>
          <input class="form-input" name="jumlah" type="number" inputmode="decimal" min="0" step="0.1" value="${a && a.jumlah ? a.jumlah : ""}" placeholder="25">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Satuan</label>
          <input class="form-input" name="satuan" value="${a ? escapeHtml(a.satuan) : ""}" placeholder="kg / liter">
        </div>
        <div class="form-group">
          <label class="form-label">Kategori Biaya *</label>
          <select class="form-select" name="kategori" required>
            ${kategoriList.map((k) => `<option ${k === selectedKategori ? "selected" : ""}>${escapeHtml(k)}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Biaya (Rp) *</label>
        <input class="form-input" name="nominal" type="number" inputmode="numeric" min="1" step="1" required value="${a ? a.nominal : ""}" placeholder="150000">
      </div>
      <div class="form-group">
        <label class="form-label">Catatan</label>
        <textarea class="form-textarea" name="catatan" placeholder="Opsional">${a ? escapeHtml(a.catatan) : ""}</textarea>
      </div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeModal()">Batal</button>
        <button type="submit" class="btn btn-primary" style="flex:1;">Simpan</button>
      </div>
    </form>`,
        );
      }
      function saveAktivitas(e, editId) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = {
          musimId: parseInt(fd.get("musimId")),
          tanggal: fd.get("tanggal"),
          jenis: fd.get("jenis"),
          sarana: fd.get("sarana").trim(),
          jumlah: parseFloat(fd.get("jumlah")) || 0,
          satuan: fd.get("satuan").trim(),
          kategori: fd.get("kategori"),
          nominal: parseFloat(fd.get("nominal")),
          catatan: fd.get("catatan").trim(),
        };
        if (!data.nominal || data.nominal <= 0) {
          showToast("Biaya harus > 0", "error");
          return;
        }
        if (data.tanggal > today()) {
          showToast("Tanggal tidak boleh masa depan", "error");
          return;
        }
        if (editId) {
          const a = state.data.aktivitas.find((x) => x.id === editId);
          if (!a) {
            showToast("Aktivitas tidak ditemukan", "error");
            return;
          }
          Object.assign(a, data);
        } else {
          state.data.aktivitas.push({ id: nextId("aktivitas"), ...data });
        }
        saveData();
        closeModal();
        renderHome();
        renderAktivitas();
        renderLaporan();
        showToast(
          editId ? "Aktivitas diperbarui" : "Aktivitas tersimpan",
          "success",
        );
      }
      function editAktivitas(id) {
        openAktivitasModal(id);
      }
      function deleteAktivitas(id) {
        const a = state.data.aktivitas.find((x) => x.id === id);
        if (!a) return;
        const m = getMusimById(a.musimId);
        const l = m ? getLahanById(m.lahanId) : null;
        const pesan =
          'Hapus aktivitas "' +
          a.jenis +
          '"' +
          (l ? " di " + l.nama : "") +
          "? Tindakan ini tidak bisa dibatalkan.";
        confirmAction({
          title: "Hapus Aktivitas?",
          message: pesan,
          confirmText: "Hapus Aktivitas",
          onConfirm() {
            state.data.aktivitas = state.data.aktivitas.filter(
              (x) => x.id !== id,
            );
            saveData();
            renderHome();
            renderAktivitas();
            renderLaporan();
            showToast("Aktivitas dihapus", "success");
          },
        });
      }

      // ============ MODAL: PANEN ============
      function openPanenModal(editId = null) {
        const p = editId ? state.data.panen.find((x) => x.id === editId) : null;
        if (editId && !p) {
          showToast("Data panen tidak ditemukan", "error");
          return;
        }
        let activeMusimList = state.data.musimTanam.filter(
          (m) =>
            getLahanList().some((l) => l.id === m.lahanId) &&
            m.status === "aktif",
        );
        if (p && !activeMusimList.some((m) => m.id === p.musimId)) {
          const mEdit = getMusimById(p.musimId);
          if (mEdit) activeMusimList = [mEdit, ...activeMusimList];
        }
        if (activeMusimList.length === 0) {
          showToast("Buat musim tanam dulu di menu Lahan", "error");
          return;
        }
        const satuanList = ["kg", "ton", "kuintal", "ikat"];
        const selectedSatuan = p ? p.satuan : satuanList[0];
        if (p && !satuanList.includes(selectedSatuan))
          satuanList.push(selectedSatuan);
        const totalPreview = p ? p.kuantitas * p.hargaSatuan : 0;
        openModal(
          p ? "Edit Panen & Penjualan" : "Catat Panen & Penjualan",
          `
    <form onsubmit="savePanen(event, ${editId || "null"})" id="panenForm">
      <div class="form-group">
        <label class="form-label">Lahan & Musim *</label>
        <select class="form-select" name="musimId" required>
          ${activeMusimList
            .map((m) => {
              const l = getLahanById(m.lahanId);
              return `<option value="${m.id}" ${p && p.musimId === m.id ? "selected" : ""}>${escapeHtml(m.komoditas)} · ${l ? escapeHtml(l.nama) : "-"}</option>`;
            })
            .join("")}
        </select>
      </div>
      <div class="form-section-title">Data Panen</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Tanggal Panen *</label>
          <input class="form-input" name="tglPanen" type="date" required value="${p ? p.tglPanen : today()}" max="${today()}">
        </div>
        <div class="form-group">
          <label class="form-label">Kuantitas *</label>
          <input class="form-input" name="kuantitas" type="number" inputmode="decimal" min="0.1" step="0.1" required value="${p ? p.kuantitas : ""}" placeholder="1000" id="panenQty" oninput="updatePanenTotal()">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Satuan *</label>
        <select class="form-select" name="satuan" required>
          ${satuanList.map((s) => `<option ${s === selectedSatuan ? "selected" : ""}>${escapeHtml(s)}</option>`).join("")}
        </select>
      </div>
      <div class="form-section-title">Data Penjualan</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Tanggal Jual *</label>
          <input class="form-input" name="tglJual" type="date" required value="${p ? p.tglJual : today()}" max="${today()}">
        </div>
        <div class="form-group">
          <label class="form-label">Pembeli *</label>
          <input class="form-input" name="pembeli" required value="${p ? escapeHtml(p.pembeli) : ""}" placeholder="Pengepul / Tengkulak">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Harga per Satuan (Rp) *</label>
        <input class="form-input" name="hargaSatuan" type="number" inputmode="numeric" min="1" step="1" required value="${p ? p.hargaSatuan : ""}" placeholder="5500" id="panenHarga" oninput="updatePanenTotal()">
      </div>
      <div id="panenTotalPreview" style="background:var(--primary-bg); border-radius:8px; padding:12px; margin-bottom:12px; text-align:center;">
        <div style="font-size:12px; color:var(--primary-dark);">Total Penjualan</div>
        <div style="font-size:20px; font-weight:700; color:var(--primary-dark);" id="panenTotalValue">${formatRupiah(totalPreview)}</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeModal()">Batal</button>
        <button type="submit" class="btn btn-primary" style="flex:1;">Simpan</button>
      </div>
    </form>`,
        );
      }
      function updatePanenTotal() {
        const qty = parseFloat(document.getElementById("panenQty").value) || 0;
        const harga =
          parseFloat(document.getElementById("panenHarga").value) || 0;
        document.getElementById("panenTotalValue").textContent = formatRupiah(
          qty * harga,
        );
      }
      function savePanen(e, editId) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = {
          musimId: parseInt(fd.get("musimId")),
          tglPanen: fd.get("tglPanen"),
          kuantitas: parseFloat(fd.get("kuantitas")),
          satuan: fd.get("satuan"),
          tglJual: fd.get("tglJual"),
          pembeli: fd.get("pembeli").trim(),
          hargaSatuan: parseFloat(fd.get("hargaSatuan")),
        };
        if (data.kuantitas <= 0) {
          showToast("Kuantitas harus > 0", "error");
          return;
        }
        if (data.hargaSatuan <= 0) {
          showToast("Harga harus > 0", "error");
          return;
        }
        if (data.tglJual < data.tglPanen) {
          showToast("Tanggal jual harus ≥ tanggal panen", "error");
          return;
        }
        if (data.tglPanen > today()) {
          showToast("Tanggal panen tidak boleh masa depan", "error");
          return;
        }
        if (editId) {
          const p = state.data.panen.find((x) => x.id === editId);
          if (!p) {
            showToast("Data panen tidak ditemukan", "error");
            return;
          }
          Object.assign(p, data);
        } else {
          state.data.panen.push({ id: nextId("panen"), ...data });
        }
        saveData();
        closeModal();
        renderHome();
        renderPanen();
        renderLaporan();
        showToast(
          editId
            ? "Panen & penjualan diperbarui"
            : "Panen & penjualan tersimpan",
          "success",
        );
      }
      function editPanen(id) {
        openPanenModal(id);
      }
      function deletePanen(id) {
        const p = state.data.panen.find((x) => x.id === id);
        if (!p) return;
        const m = getMusimById(p.musimId);
        const l = m ? getLahanById(m.lahanId) : null;
        const pesan =
          'Hapus data panen "' +
          p.pembeli +
          '"' +
          (l ? " di " + l.nama : "") +
          "? Tindakan ini tidak bisa dibatalkan.";
        confirmAction({
          title: "Hapus Data Panen?",
          message: pesan,
          confirmText: "Hapus Panen",
          onConfirm() {
            state.data.panen = state.data.panen.filter((x) => x.id !== id);
            saveData();
            renderHome();
            renderPanen();
            renderLaporan();
            showToast("Data panen dihapus", "success");
          },
        });
      }

      // ============ INIT ============
      function init() {
        state.data = loadData();
        saveData();
        const savedMusimId = parseInt(
          localStorage.getItem("taniku_active_musim"),
        );
        if (savedMusimId) state.selectedMusimId = savedMusimId;
        showApp();
      }
      init();

      // Expose for onclick
      window.navigate = navigate;
      window.openLahanModal = openLahanModal;
      window.saveLahan = saveLahan;
      window.editLahan = editLahan;
      window.deleteLahan = deleteLahan;
      window.openMusimModal = openMusimModal;
      window.saveMusim = saveMusim;
      window.closeMusim = closeMusim;
      window.openAktivitasModal = openAktivitasModal;
      window.saveAktivitas = saveAktivitas;
      window.editAktivitas = editAktivitas;
      window.deleteAktivitas = deleteAktivitas;
      window.openPanenModal = openPanenModal;
      window.savePanen = savePanen;
      window.editPanen = editPanen;
      window.deletePanen = deletePanen;
      window.updatePanenTotal = updatePanenTotal;
      window.closeModal = closeModal;
      window.confirmAction = confirmAction;
      window.jalankanKonfirmasi = jalankanKonfirmasi;
      window.renderLaporan = renderLaporan;
      window.openMusimSwitcher = openMusimSwitcher;
      window.pilihMusimAktif = pilihMusimAktif;
      window.buatMusimDariSwitcher = buatMusimDariSwitcher;
      window.openLahanFilter = openLahanFilter;
      window.setFilterLahan = setFilterLahan;
      window.exportBackup = exportBackup;
      window.importBackup = importBackup;
      window.tanikuImportData = tanikuImportData;
    </script>
  </body>
</html>
