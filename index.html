<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#2e7d32" />
    <title>Taniku · Sistem Manajemen Usahatani</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        --primary: #2e7d32;
        --primary-dark: #1b5e20;
        --primary-light: #66bb6a;
        --primary-bg: #e8f5e9;
        --danger: #d32f2f;
        --warning: #f57c00;
        --success: #388e3c;
        --bg: #f0f4f0;
        --card: #ffffff;
        --text: #212121;
        --text-muted: #757575;
        --border: #e0e0e0;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.12);
        --radius: 12px;
      }
      html,
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 15px;
        line-height: 1.5;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
      }
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 15px;
      }
      a {
        color: var(--primary);
        text-decoration: none;
      }
      .hidden {
        display: none !important;
      }

      /* ===== Capil Logo (SVG) ===== */
      .capil-svg {
        display: block;
      }
      .capil-brand {
        width: 24px;
        height: 24px;
        display: inline-block;
        vertical-align: middle;
        margin-right: 6px;
        margin-top: -2px;
      }

      /* ===== Buttons ===== */
      .btn {
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 500;
        font-size: 14px;
        transition: all 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        justify-content: center;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--primary);
        color: white;
      }
      .btn-primary:hover {
        background: var(--primary-dark);
      }
      .btn-outline {
        background: white;
        color: var(--primary);
        border: 1.5px solid var(--primary);
      }
      .btn-outline:hover {
        background: var(--primary-bg);
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 13px;
      }
      .btn-danger {
        background: var(--danger);
        color: white;
      }
      .btn-ghost {
        color: var(--text-muted);
        padding: 8px;
        font-size: 20px;
      }
      .btn-block {
        width: 100%;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      /* ===== App Layout ===== */
      .app {
        min-height: 100vh;
        padding-bottom: 80px;
      }
      .app-header {
        position: sticky;
        top: 0;
        z-index: 40;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-light) 100%
        );
        color: white;
        padding: 14px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .header-brand {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.3px;
        display: flex;
        align-items: center;
      }
      .app-main {
        padding: 16px 16px 20px;
        max-width: 720px;
        margin: 0 auto;
      }
      .page {
        animation: fadeIn 0.2s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ===== Cards ===== */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 16px;
        box-shadow: var(--shadow);
        margin-bottom: 12px;
      }
      .card-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text);
      }
      .card-sub {
        font-size: 13px;
        color: var(--text-muted);
      }

      /* Musim active card */
      .musim-card {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-light) 100%
        );
        color: white;
        border-radius: var(--radius);
        padding: 18px;
        margin-bottom: 16px;
        box-shadow: var(--shadow);
      }
      .musim-card-label {
        font-size: 12px;
        opacity: 0.9;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .musim-card-name {
        font-size: 18px;
        font-weight: 700;
        margin: 4px 0 8px;
      }
      .musim-card-meta {
        font-size: 13px;
        opacity: 0.9;
      }
      .musim-progress {
        background: rgba(255, 255, 255, 0.25);
        height: 6px;
        border-radius: 3px;
        margin-top: 12px;
        overflow: hidden;
      }
      .musim-progress-bar {
        background: white;
        height: 100%;
        border-radius: 3px;
        transition: width 0.5s;
      }
      .musim-card-click {
        cursor: pointer;
        transition:
          transform 0.1s,
          box-shadow 0.15s;
      }
      .musim-card-click:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-lg);
      }
      .musim-card-click:active {
        transform: none;
      }
      .musim-card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }
      .musim-card-switch {
        flex: 0 0 auto;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
      }
      .musim-card-hint {
        font-size: 11px;
        opacity: 0.75;
        margin-top: 10px;
      }

      /* Musim switcher (modal) */
      .musim-option-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .musim-option {
        width: 100%;
        text-align: left;
        background: var(--bg);
        border: 1.5px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        font: inherit;
        color: var(--text);
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .musim-option:hover {
        border-color: var(--primary);
        background: var(--primary-bg);
      }
      .musim-option.selected {
        border-color: var(--primary);
        background: var(--primary-bg);
      }
      .musim-option-main {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .musim-option-name {
        font-size: 14px;
        font-weight: 600;
      }
      .musim-option-sub {
        font-size: 12px;
        color: var(--text-muted);
      }
      .musim-option-check {
        color: var(--primary);
        font-weight: 700;
      }
      .musim-option-action {
        color: var(--primary);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .musim-option-note {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 12px;
      }

      /* Metrics grid */
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 16px;
      }
      .metric-card {
        background: white;
        border-radius: var(--radius);
        padding: 12px;
        box-shadow: var(--shadow);
        text-align: center;
      }
      .metric-label {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        margin-bottom: 4px;
      }
      .metric-value {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        word-break: break-word;
      }
      .metric-value.profit {
        color: var(--success);
      }
      .metric-value.loss {
        color: var(--danger);
      }

      /* Section header */
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 20px 0 12px;
      }
      .section-header h2 {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
      }
      .section-header .link {
        font-size: 13px;
        color: var(--primary);
        font-weight: 500;
      }

      /* Page header */
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .page-header h1 {
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
      }

      /* List item */
      .list-item {
        background: white;
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: 10px;
        box-shadow: var(--shadow);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        transition: transform 0.1s;
      }
      .list-item:hover {
        transform: translateY(-1px);
      }
      .list-item-main {
        flex: 1;
        min-width: 0;
      }
      .list-item-title {
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 2px;
      }
      .list-item-sub {
        font-size: 12px;
        color: var(--text-muted);
      }
      .list-item-amount {
        font-weight: 700;
        color: var(--text);
        font-size: 14px;
        white-space: nowrap;
      }
      .list-item-side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        flex: 0 0 auto;
      }
      .list-item-actions {
        display: flex;
        gap: 2px;
      }
      .list-item-actions .btn-ghost {
        font-size: 15px;
        padding: 4px 6px;
        line-height: 1;
      }
      .list-item-amount.expense {
        color: var(--danger);
      }
      .list-item-amount.income {
        color: var(--success);
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-muted);
      }
      .empty-icon {
        font-size: 48px;
        opacity: 0.3;
        margin-bottom: 12px;
      }
      .empty-text {
        font-size: 14px;
      }

      /* Quick actions */
      .quick-actions {
        display: flex;
        gap: 10px;
        margin: 16px 0;
      }
      .quick-actions .btn {
        flex: 1;
      }

      /* Bottom Nav */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: white;
        display: flex;
        border-top: 1px solid var(--border);
        padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
        z-index: 50;
        box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.05);
      }
      .nav-item {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 6px 4px;
        margin: 0 2px;
        border-radius: 10px;
        color: var(--text-muted);
        font-size: 10.5px;
        gap: 2px;
        transition:
          color 0.15s,
          background-color 0.15s;
      }
      .nav-item::before {
        content: "";
        position: absolute;
        top: -6px;
        left: 50%;
        width: 26px;
        height: 3px;
        border-radius: 0 0 3px 3px;
        background: var(--primary);
        transform: translateX(-50%) scaleX(0);
        transition: transform 0.15s;
      }
      .nav-item.active {
        color: var(--primary);
        background: var(--primary-bg);
        font-weight: 700;
      }
      .nav-item.active::before {
        transform: translateX(-50%) scaleX(1);
      }
      .nav-icon {
        font-size: 20px;
        line-height: 1;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        animation: fadeIn 0.15s;
      }
      .modal {
        background: white;
        border-radius: 16px;
        padding: 20px;
        max-width: 500px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: var(--shadow-lg);
        animation: slideUp 0.2s ease;
      }
      @keyframes slideUp {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .modal-title {
        font-size: 17px;
        font-weight: 700;
      }
      .modal-close {
        font-size: 24px;
        color: var(--text-muted);
        padding: 0;
        line-height: 1;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-close:hover {
        background: var(--bg);
      }

      /* Forms */
      .form-group {
        margin-bottom: 14px;
      }
      .form-label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 5px;
      }
      .form-input,
      .form-select,
      .form-textarea {
        width: 100%;
        padding: 11px 13px;
        border: 1.5px solid var(--border);
        border-radius: 9px;
        font-size: 15px;
        background: white;
        transition: border-color 0.15s;
      }
      .form-input:focus,
      .form-select:focus,
      .form-textarea:focus {
        outline: none;
        border-color: var(--primary);
      }
      .form-textarea {
        resize: vertical;
        min-height: 60px;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .form-section-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 18px 0 10px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #323232;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 200;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s,
          transform 0.25s;
        max-width: 90vw;
        text-align: center;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.success {
        background: var(--success);
      }
      .toast.error {
        background: var(--danger);
      }

      /* Laporan */
      .laporan-section {
        margin-bottom: 18px;
      }
      .laporan-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px dashed var(--border);
        font-size: 14px;
      }
      .laporan-row:last-child {
        border-bottom: none;
      }
      .laporan-row.total {
        font-weight: 700;
        border-top: 2px solid var(--text);
        border-bottom: none;
        padding-top: 12px;
        margin-top: 6px;
      }
      .laporan-row .label {
        color: var(--text);
      }
      .laporan-row .value {
        font-family: "Courier New", monospace;
      }
      .laba-box {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-light) 100%
        );
        color: white;
        padding: 20px;
        border-radius: var(--radius);
        text-align: center;
        margin: 16px 0;
      }
      .laba-box.rugi {
        background: linear-gradient(135deg, var(--danger) 0%, #ef5350 100%);
      }
      .laba-label {
        font-size: 12px;
        opacity: 0.9;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .laba-value {
        font-size: 26px;
        font-weight: 800;
        margin-top: 6px;
      }

      @media print {
        * {
          animation: none !important;
          transition: none !important;
        }
        body * {
          visibility: hidden;
        }
        #laporanPrintArea,
        #laporanPrintArea * {
          visibility: visible;
        }
        #laporanPrintArea {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          padding: 20px;
          background: white;
        }
        .no-print {
          display: none !important;
        }
        .laba-box {
          color: black !important;
          background: #e8f5e9 !important;
          border: 2px solid #2e7d32;
        }
      }

      @media (min-width: 720px) {
        .app-main {
          padding: 24px;
        }
        .metrics-grid {
          gap: 14px;
        }
        .metric-value {
          font-size: 17px;
        }
      }
      @media (max-width: 380px) {
        .metric-value {
          font-size: 13px;
        }
        .metric-label {
          font-size: 10px;
        }
      }

      .chip {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        background: var(--primary-bg);
        color: var(--primary-dark);
      }
      .chip-contoh {
        background: #fff3cd;
        color: #8a6d3b;
        font-weight: 500;
        vertical-align: middle;
      }
      .sample-note {
        margin: -6px 0 14px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #fff8e1;
        border: 1px solid #ffe082;
        color: #7a5b00;
        font-size: 12px;
        line-height: 1.4;
      }
      .filter-info {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
        font-size: 12px;
        color: var(--text-muted);
      }
      .filter-info button {
        color: var(--danger);
        font-size: 12px;
        font-weight: 600;
        padding: 2px 4px;
      }
      .confirm-message {
        font-size: 14px;
        color: var(--text);
        line-height: 1.6;
        margin-bottom: 18px;
      }
      .confirm-actions {
        display: flex;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <!-- ===== SVG CAPIL (reusable, hidden template) ===== -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="capil-icon">
          <!-- Brim belakang (sebagian tertutup kerucut) -->
          <ellipse
            cx="50"
            cy="70"
            rx="46"
            ry="9"
            fill="#d4b483"
            stroke="#6b4423"
            stroke-width="2.5"
          />
          <!-- Kerucut capil -->
          <path
            d="M 50 12 L 22 68 L 78 68 Z"
            fill="#e8c9a0"
            stroke="#6b4423"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
          <!-- Garis tenun horizontal -->
          <line
            x1="29"
            y1="56"
            x2="71"
            y2="56"
            stroke="#6b4423"
            stroke-width="1.2"
            opacity="0.45"
          />
          <line
            x1="35"
            y1="46"
            x2="65"
            y2="46"
            stroke="#6b4423"
            stroke-width="1.2"
            opacity="0.45"
          />
          <line
            x1="40"
            y1="36"
            x2="60"
            y2="36"
            stroke="#6b4423"
            stroke-width="1.2"
            opacity="0.45"
          />
          <line
            x1="45"
            y1="26"
            x2="55"
            y2="26"
            stroke="#6b4423"
            stroke-width="1.2"
            opacity="0.45"
          />
          <!-- Garis tenun diagonal (vertikal) -->
          <line
            x1="36"
            y1="30"
            x2="42"
            y2="64"
            stroke="#6b4423"
            stroke-width="0.9"
            opacity="0.3"
          />
          <line
            x1="50"
            y1="20"
            x2="50"
            y2="64"
            stroke="#6b4423"
            stroke-width="0.9"
            opacity="0.3"
          />
          <line
            x1="64"
            y1="30"
            x2="58"
            y2="64"
            stroke="#6b4423"
            stroke-width="0.9"
            opacity="0.3"
          />
          <!-- Brim depan (outline) -->
          <path
            d="M 4 70 Q 50 82 96 70"
            fill="none"
            stroke="#6b4423"
            stroke-width="2.5"
          />
          <!-- Knob atas -->
          <circle cx="50" cy="12" r="2.8" fill="#6b4423" />
        </g>
      </defs>
    </svg>

    <!-- ===== APP ===== -->
    <div id="app" class="app">
      <header class="app-header">
        <div class="header-brand">
          <svg class="capil-svg capil-brand" viewBox="0 0 100 100">
            <use href="#capil-icon" />
          </svg>
          Taniku
        </div>
      </header>

      <main class="app-main">
        <!-- Home -->
        <section id="page-home" class="page">
          <div id="activeMusimCard"></div>
          <div class="metrics-grid" id="metricsGrid"></div>
          <div class="section-header">
            <h2>Riwayat Aktivitas</h2>
            <a
              href="#"
              class="link"

              🖨 Cetak

          <div class="card no-print" style="margin-top:12px;">
            <div class="card-title">Cadangan Data</div>
            <div class="card-sub" style="margin-bottom:12px;">
              Simpan seluruh data ke file JSON atau pulihkan dari cadangan.
              Data hanya tersimpan di perangkat ini.
            </div>

              <button class="btn btn-outline btn-sm" style="flex:1;" onclick="exportBackup()">

      <nav class="bottom-nav" aria-label="Menu utama">
        <button
          class="nav-item active"
          data-page="home"
          aria-current="page"
          onclick="navigate('home')"
        >
          <span class="nav-icon">🏠</span><span>Home</span>
        </button>
        <button class="nav-item" data-page="lahan" onclick="navigate('lahan')">
          <span class="nav-icon">🌱</span><span>Lahan</span>
        </button>
        <button
          class="nav-item"
          data-page="aktivitas"
          onclick="navigate('aktivitas')"
        >
          <span class="nav-icon">📝</span><span>Aktivitas</span>
        </button>
        <button class="nav-item" data-page="panen" onclick="navigate('panen')">
          <span class="nav-icon">🌾</span><span>Panen</span>
        </button>
        <button
          class="nav-item"
          data-page="laporan"
          onclick="navigate('laporan')"
        >
          <span class="nav-icon">📊</span><span>Laporan</span>
        </button>
      </nav>
    </div>

    <!-- Modals & Toast -->
    <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal" id="modalContent"></div>
    </div>
    <div id="toast" class="toast"></div>

    <script>
      // ============ STATE ============
      const STORAGE_KEY = "taniku_v1";
      const SEED_VERSION_KEY = "taniku_seed_version";
      const SEED_VERSION = 10;
      const state = {
        currentPage: "home",
        selectedMusimId: null,
        filterLahan: { aktivitas: null, panen: null },
        data: { lahan: [], musimTanam: [], aktivitas: [], panen: [] },
      };

      // ============ SEED DATA ============
      function seedData() {
        return {
          lahan: [],
          musimTanam: [],
          aktivitas: [],
          panen: [],
        };
      }

      // ============ PERSISTENCE ============
      function normalizeDataShape(input) {
        const src = input && typeof input === "object" ? input : {};
        const data = {};
        const isObject = (v) => v && typeof v === "object";
        const toNumber = (v) => {
          const n = Number(v);
          return Number.isFinite(n) ? n : 0;
        };
        const toText = (v) => (v == null ? "" : String(v));
        ["lahan", "musimTanam", "aktivitas", "panen"].forEach((k) => {
          data[k] = Array.isArray(src[k]) ? src[k].filter(isObject) : [];
        });
        data.lahan.forEach((l) => {
          delete l.userId;
          l.id = toNumber(l.id);
          l.luas = toNumber(l.luas);
          l.nama = toText(l.nama);
          l.lokasi = toText(l.lokasi);
        });
        data.musimTanam.forEach((m) => {
          m.id = toNumber(m.id);
          m.lahanId = toNumber(m.lahanId);
          m.komoditas = toText(m.komoditas);
          m.tglMulai = toText(m.tglMulai);
          m.tglSelesai = m.tglSelesai ? toText(m.tglSelesai) : null;
          if (m.status !== "aktif" && m.status !== "selesai") {
            m.status = "aktif";
          }
        });
        data.aktivitas.forEach((a) => {
          a.id = toNumber(a.id);
          a.musimId = toNumber(a.musimId);
          a.tanggal = toText(a.tanggal);
          a.jenis = toText(a.jenis);
          a.sarana = toText(a.sarana);
          a.jumlah = toNumber(a.jumlah);
          a.satuan = toText(a.satuan);
          a.kategori = toText(a.kategori);
          a.nominal = toNumber(a.nominal);
          a.catatan = toText(a.catatan);
        });
        data.panen.forEach((p) => {
          p.id = toNumber(p.id);
          p.musimId = toNumber(p.musimId);
          p.tglPanen = toText(p.tglPanen);
          p.kuantitas = toNumber(p.kuantitas);
          p.satuan = toText(p.satuan);
          p.tglJual = toText(p.tglJual);
          p.pembeli = toText(p.pembeli);
          p.hargaSatuan = toNumber(p.hargaSatuan);
        });
        return data;
      }
      function migrateSeedData(data, version) {
        const v = parseInt(version, 10) || 0;

        if (v < 5) {
          const lahanLama = data.lahan.find(
            (l) => l && l.nama === "Kebun Kademangan",
          );
          if (lahanLama) {
            lahanLama.nama = "Sawah Wonorejo";
            lahanLama.lokasi = "Wonorejo, Blitar";
          }

          const musimKosong = data.musimTanam.find(
            (m) =>
              m &&
              m.id === 2 &&
              m.lahanId === 2 &&
              m.komoditas === "Jagung" &&
              m.status === "aktif" &&
              m.tglMulai === "2026-08-15",
          );
          const sudahDipakai =
            data.aktivitas.some((a) => a.musimId === 2) ||
            data.panen.some((p) => p.musimId === 2);
          if (musimKosong) {
            if (!sudahDipakai) {
              data.musimTanam = data.musimTanam.filter((m) => m.id !== 2);
              if (localStorage.getItem("taniku_active_musim") === "2") {
                localStorage.removeItem("taniku_active_musim");
              }
            } else {
              musimKosong.status = "selesai";
              musimKosong.tglSelesai = "2026-10-31";
            }
          }

          data.panen.forEach((p) => {
            if (p && p.pembeli === "Pasar Kademangan") {
              p.pembeli = "Pasar Wonorejo";
            }
          });
        }

        if (v < 6) {
          data.lahan.forEach((l) => {
            if (l && l.nama === "Tegalan Gandusari") {
              l.nama = "Kebun Gandusari";
            }
          });

          const musimCabai = data.musimTanam.find(
            (m) =>
              m &&
              m.id === 4 &&
              m.lahanId === 3 &&
              m.komoditas === "Cabai" &&
              (m.tglMulai === "2025-03-01" ||
                m.tglSelesai === "2025-08-30"),
          );
          if (musimCabai) {
            musimCabai.tglMulai = "2026-06-01";
            musimCabai.tglSelesai = null;
            musimCabai.status = "aktif";
          }

          data.aktivitas.forEach((a) => {
            if (a && a.musimId === 4 && a.tanggal === "2025-03-10") {
              a.tanggal = "2026-06-05";
            }
          });
          data.panen.forEach((p) => {
            if (p && p.musimId === 4 && p.tglPanen === "2025-08-20") {
              p.tglPanen = "2026-10-20";
            }
            if (p && p.musimId === 4 && p.tglJual === "2025-08-21") {
              p.tglJual = "2026-10-21";
            }
            if (p && p.pembeli === "Pasar Kademangan") {
              p.pembeli = "Pasar Wonorejo";
            }
          });
        }

        if (v < 7) {
          const dataLama =
            data.lahan.some((l) => l && l.nama === "Sawah Talun") ||
            data.lahan.some((l) => l && l.nama === "Kebun Gandusari") ||
            data.lahan.some((l) => l && l.nama === "Sawah Wonorejo");
          if (dataLama) {
            data = seedData();
            localStorage.removeItem("taniku_active_musim");
          }
        }

        if (v < 8) {
          data.lahan.forEach((l) => {
            if (
              l &&
              l.nama === "Kebun Cabai Wonorejo" &&
              Number(l.luas) === 1406
            ) {
              l.contoh = true;
            }
          });
        }

        if (v < 9) {
          const contoh = data.lahan.find(
            (l) =>
              l &&
              l.nama === "Kebun Cabai Wonorejo" &&
              Number(l.luas) === 1406 &&
              l.contoh === true,
          );
          if (contoh) {
            const hapus = new Set([5, 6, 9, 12, 13]);
            data.aktivitas = data.aktivitas.filter(
              (a) => !(a.musimId === 1 && hapus.has(a.id)),
            );
            const sudahAda = data.aktivitas.some(
              (a) =>
                a.musimId === 1 &&
                a.kategori === "Tenaga kerja" &&
                a.tanggal >= "2026-08-01",
            );
            if (!sudahAda) {
              const tanggalPanen = [
                "2026-08-02",
                "2026-08-06",
                "2026-08-09",
                "2026-08-13",
                "2026-08-16",
              ];
              let idBaru = Math.max(0, ...data.aktivitas.map((a) => a.id)) + 1;
              tanggalPanen.forEach((tgl) => {
                data.aktivitas.push({
                  id: idBaru++,
                  musimId: 1,
                  tanggal: tgl,
                  jenis: "Panen",
                  sarana: "Tenaga kerja panen",
                  jumlah: 1,
                  satuan: "kali",
                  kategori: "Tenaga kerja",
                  nominal: 100000,
                  catatan: "",
                });
              });
            }
          }
        }

        if (v < 10) {
          const hapusLahan = new Set(
            data.lahan
              .filter(
                (l) =>
                  l &&
                  (l.contoh === true ||
                    (l.nama === "Kebun Cabai Wonorejo" &&
                      Number(l.luas) === 1406)),
              )
              .map((l) => l.id),
          );
          if (hapusLahan.size) {
            const hapusMusim = new Set(
              data.musimTanam
                .filter((m) => m && hapusLahan.has(m.lahanId))
                .map((m) => m.id),
            );
            data.lahan = data.lahan.filter((l) => !hapusLahan.has(l.id));
            data.musimTanam = data.musimTanam.filter(
              (m) => !hapusMusim.has(m.id),
            );
            data.aktivitas = data.aktivitas.filter(
              (a) => !hapusMusim.has(a.musimId),
            );
            data.panen = data.panen.filter((p) => !hapusMusim.has(p.musimId));
            const simpan = localStorage.getItem("taniku_active_musim");
            if (simpan && hapusMusim.has(parseInt(simpan, 10))) {
              localStorage.removeItem("taniku_active_musim");
            }
          }
        }

        return data;
      }
      function loadData() {
        const raw = localStorage.getItem(STORAGE_KEY);
        const version = localStorage.getItem(SEED_VERSION_KEY);
        if (raw) {
          try {
            let data = normalizeDataShape(JSON.parse(raw));
            if (version !== String(SEED_VERSION)) {
              data = migrateSeedData(data, version);
              localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
              localStorage.setItem(SEED_VERSION_KEY, String(SEED_VERSION));
            }
            return data;
          } catch (e) {}
        }
        const data = seedData();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        localStorage.setItem(SEED_VERSION_KEY, String(SEED_VERSION));
        localStorage.removeItem("taniku_active_musim");
        return data;
      }
      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      }

      // ============ BACKUP / RESTORE ============
      function exportBackup() {
        if (
          !window.TanikuAndroid ||
          typeof TanikuAndroid.exportData !== "function"
        ) {
          showToast("Ekspor hanya tersedia di aplikasi Android", "error");
          return;
        }
        try {
          TanikuAndroid.exportData(
            JSON.stringify(state.data, null, 2),
            "taniku-backup-" + today() + ".json",
          );
        } catch (e) {
          showToast("Gagal mengekspor data", "error");
        }
      }

      function importBackup() {
        if (
          !window.TanikuAndroid ||
          typeof TanikuAndroid.importData !== "function"
        ) {
          showToast("Impor hanya tersedia di aplikasi Android", "error");
          return;
        }
        confirmAction({
          title: "Impor Cadangan?",
          message:
            "Data yang ada saat ini akan diganti dengan isi file cadangan. Lanjutkan?",
          confirmText: "Pilih File",
          danger: false,
          onConfirm() {
            try {
              TanikuAndroid.importData();
            } catch (e) {
              showToast("Gagal membuka file cadangan", "error");
            }
          },
        });
      }

      function tanikuImportData(text) {
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch (e) {
          showToast("File cadangan tidak valid", "error");
          return;
        }
        if (!parsed || typeof parsed !== "object") {
          showToast("File cadangan tidak valid", "error");
          return;
        }
        state.data = normalizeDataShape(parsed);
        state.selectedMusimId = null;
        state.filterLahan = { aktivitas: null, panen: null };
        try {
          localStorage.removeItem("taniku_active_musim");
        } catch (e) {}
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
        localStorage.setItem(SEED_VERSION_KEY, String(SEED_VERSION));
        renderHome();
        renderLahan();
        renderAktivitas();
        renderPanen();
        renderLaporan();
        showToast("Cadangan berhasil diimpor", "success");
      }

      function nextId(key) {
        const arr = state.data[key];
        return arr.length ? Math.max(...arr.map((x) => x.id)) + 1 : 1;
      }

      // ============ HELPERS ============
      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      function formatRupiah(n) {
        return "Rp " + Math.round(n).toLocaleString("id-ID");
      }
      function formatTanggal(s) {
        if (!s) return "-";
        const [y, m, d] = String(s).slice(0, 10).split("-");
        if (!y || !m || !d) return escapeHtml(s);
        return `${d.padStart(2, "0")}/${m.padStart(2, "0")}/${y}`;
      }
      function today() {
        const d = new Date();
        const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
        return local.toISOString().split("T")[0];
      }
      function showToast(msg, type = "") {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.className = "toast show " + (type || "");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => {
          t.className = "toast " + (type || "");
        }, 2500);
      }

      // ============ DATA QUERIES ============
      function getLahanList() {
        return state.data.lahan;
      }
      function getLahanMusim(lahanId) {
        return state.data.musimTanam.filter((m) => m.lahanId === lahanId);
      }
      function getActiveMusim() {
        const lahanIds = getLahanList().map((l) => l.id);
        const aktifList = state.data.musimTanam.filter(
          (m) => lahanIds.includes(m.lahanId) && m.status === "aktif",
        );
        if (aktifList.length === 0) return null;
        return (
          aktifList.find((m) => m.id === state.selectedMusimId) || aktifList[0]
        );
      }
      function getMusimById(id) {
        return state.data.musimTanam.find((m) => m.id === id);
      }
      function getLahanById(id) {
        return state.data.lahan.find((l) => l.id === id);
      }
      function getAktivitasForMusim(musimId) {
        return state.data.aktivitas
          .filter((a) => a.musimId === musimId)
          .sort((a, b) => b.tanggal.localeCompare(a.tanggal));
      }
      function getPanenForMusim(musimId) {
        return state.data.panen
          .filter((p) => p.musimId === musimId)
          .sort((a, b) => b.tglPanen.localeCompare(a.tglPanen));
      }
      function getAktivitasAll() {
        const musimIds = state.data.musimTanam
          .filter((m) => getLahanList().some((l) => l.id === m.lahanId))
          .map((m) => m.id);
        return state.data.aktivitas
          .filter((a) => musimIds.includes(a.musimId))
          .sort((a, b) => b.tanggal.localeCompare(a.tanggal));
      }
      function getPanenAll() {
        const musimIds = state.data.musimTanam
          .filter((m) => getLahanList().some((l) => l.id === m.lahanId))
          .map((m) => m.id);
        return state.data.panen
          .filter((p) => musimIds.includes(p.musimId))
          .sort((a, b) => b.tglPanen.localeCompare(a.tglPanen));
      }
      function getFilterLahan(page) {
        const id = state.filterLahan[page];
        if (!id) return null;
        return getLahanList().some((l) => l.id === id) ? id : null;
      }
      function setFilterLahan(page, lahanId) {
        const id = lahanId ? parseInt(lahanId) : null;
        state.filterLahan[page] =
          id && getLahanList().some((l) => l.id === id) ? id : null;
        closeModal();
        if (page === "aktivitas") renderAktivitas();
        if (page === "panen") renderPanen();
      }
      function openLahanFilter(page) {
        const lahanList = getLahanList();
        if (lahanList.length === 0) {
          showToast("Belum ada lahan", "error");
          return;
        }
        const isAktivitas = page === "aktivitas";
        const aktifId = getFilterLahan(page);
        const jumlahFor = (lahanId) =>
          isAktivitas
            ? state.data.aktivitas.filter((a) => {
                const m = getMusimById(a.musimId);
                return m && m.lahanId === lahanId;
              }).length
            : state.data.panen.filter((p) => {
                const m = getMusimById(p.musimId);
                return m && m.lahanId === lahanId;
              }).length;
        const satuan = isAktivitas ? "aktivitas" : "panen";
        const semua = `<button type="button" class="musim-option ${!aktifId ? "selected" : ""}" onclick="setFilterLahan('${page}', null)">
      <span class="musim-option-main">
        <span class="musim-option-name">Semua Lahan</span>
        <span class="musim-option-sub">Tampilkan seluruh riwayat ${satuan}</span>
      </span>
      <span class="musim-option-check">${!aktifId ? "✓" : "›"}</span>
    </button>`;
        const rows = lahanList
          .map((l) => {
            const isCurrent = aktifId === l.id;
            return `<button type="button" class="musim-option ${isCurrent ? "selected" : ""}" onclick="setFilterLahan('${page}', ${l.id})">
      <span class="musim-option-main">
        <span class="musim-option-name">${escapeHtml(l.nama)}</span>
        <span class="musim-option-sub">${jumlahFor(l.id)} ${satuan} · ${escapeHtml(l.lokasi)}</span>
      </span>
      <span class="musim-option-check">${isCurrent ? "✓" : "›"}</span>
    </button>`;
          })
          .join("");
        openModal(
          "Filter Lahan · " + (isAktivitas ? "Aktivitas" : "Panen"),
          `
    <div class="musim-option-list">${semua}${rows}</div>
    <p class="musim-option-note">Pilih satu lahan untuk menyaring riwayat ${satuan}.</p>`,
        );
      }
      function renderFilterLahanInfo(page, infoId, lahanId, total, shown) {
        const btn = document.getElementById(page + "FilterBtn");
        const lahan = lahanId ? getLahanById(lahanId) : null;
        if (btn) {
          btn.textContent = lahan ? "Filter: " + lahan.nama : "Filter";
          btn.classList.toggle("btn-primary", !!lahan);
          btn.classList.toggle("btn-outline", !lahan);
        }
        const info = document.getElementById(infoId);
        if (!info) return;
        info.innerHTML = lahan
          ? `<div class="filter-info">Menampilkan <span class="chip">${escapeHtml(lahan.nama)}</span> ${shown} dari ${total} <button type="button" onclick="setFilterLahan('${page}', null)">Hapus filter</button></div>`
          : "";
      }
      function hitungLabaRugi(musimId) {
        const biaya = state.data.aktivitas
          .filter((a) => a.musimId === musimId)
          .reduce((s, a) => s + a.nominal, 0);
        const pendapatan = state.data.panen
          .filter((p) => p.musimId === musimId)
          .reduce((s, p) => s + p.kuantitas * p.hargaSatuan, 0);
        return { biaya, pendapatan, laba: pendapatan - biaya };
      }
      function totalPanenForMusim(musimId) {
        return state.data.panen
          .filter((p) => p.musimId === musimId)
          .reduce((s, p) => s + p.kuantitas, 0);
      }

      function showApp() {
        document.getElementById("app").classList.remove("hidden");
        navigate("home");
      }

      // ============ NAVIGATION ============
      function navigate(page) {
        state.currentPage = page;
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.add("hidden"));
        document.getElementById("page-" + page).classList.remove("hidden");
        document.querySelectorAll(".nav-item").forEach((n) => {
          const active = n.dataset.page === page;
          n.classList.toggle("active", active);
          if (active) n.setAttribute("aria-current", "page");
          else n.removeAttribute("aria-current");
        });
        window.scrollTo({ top: 0, behavior: "smooth" });
        if (page === "home") renderHome();
        if (page === "lahan") renderLahan();
        if (page === "aktivitas") renderAktivitas();
        if (page === "panen") renderPanen();
        if (page === "laporan") renderLaporan();
      }

      // ============ RENDER: HOME ============
      function renderHome() {
        const musim = getActiveMusim();
        const musimCard = document.getElementById("activeMusimCard");
        const metricsGrid = document.getElementById("metricsGrid");

        if (!musim) {
          musimCard.innerHTML = `
      <div class="card" style="text-align:center; padding: 24px;">
        <div style="font-size: 36px; margin-bottom: 8px;">🌱</div>
        <div style="font-weight: 600; margin-bottom: 6px;">Belum ada musim tanam aktif</div>
        <div class="card-sub" style="margin-bottom: 12px;">Mulai dengan menambahkan lahan &amp; musim tanam</div>
        <button class="btn btn-primary btn-sm" onclick="navigate('lahan')">Kelola Lahan</button>
      </div>`;
          metricsGrid.innerHTML = "";
        } else {
          const lahan = getLahanById(musim.lahanId);
          const { biaya, laba } = hitungLabaRugi(musim.id);
          const panen = totalPanenForMusim(musim.id);
          const tglMulai = new Date(musim.tglMulai);
          const selisihHari = Math.floor(
            (new Date() - tglMulai) / (1000 * 60 * 60 * 24),
          );
          const hariBerjalan =
            Number.isFinite(selisihHari) && selisihHari > 0 ? selisihHari : 1;
          const progress = Math.min(
            100,
            Math.floor((hariBerjalan / 120) * 100),
          );

          musimCard.innerHTML = `
      <div class="musim-card musim-card-click" role="button" tabindex="0"
           aria-label="Ganti lahan dan musim aktif"
           onclick="openMusimSwitcher()"
           onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openMusimSwitcher(); }">
        <div class="musim-card-top">
          <div>
            <div class="musim-card-label">Musim Aktif</div>
            <div class="musim-card-name">${escapeHtml(musim.komoditas)} · ${lahan ? escapeHtml(lahan.nama) : "?"}</div>
            <div class="musim-card-meta">Mulai ${formatTanggal(musim.tglMulai)} · Hari ke-${hariBerjalan}</div>
          </div>
          <span class="musim-card-switch" aria-hidden="true">⇄</span>
        </div>
        <div class="musim-progress"><div class="musim-progress-bar" style="width:${progress}%"></div></div>
        <div class="musim-card-hint">Tap untuk ganti lahan</div>
      </div>${
        lahan && lahan.contoh
          ? '<div class="sample-note">Data contoh untuk uji tampilan, bukan data hasil penelitian lapangan.</div>'
          : ""
      }`;

          metricsGrid.innerHTML = `
      <div class="metric-card">
        <div class="metric-label">Biaya</div>
        <div class="metric-value loss">${formatRupiah(biaya)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Panen</div>
        <div class="metric-value">${panen.toLocaleString("id-ID")} kg</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Laba</div>
        <div class="metric-value ${laba >= 0 ? "profit" : "loss"}">${formatRupiah(laba)}</div>
      </div>`;
        }

        const recent = getAktivitasAll().slice(0, 3);
        const recentEl = document.getElementById("recentAktivitas");
        if (recent.length === 0) {
          recentEl.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">Belum ada aktivitas tercatat</div></div>`;
        } else {
          recentEl.innerHTML = recent
            .map((a) => {
              const m = getMusimById(a.musimId);
              const l = m ? getLahanById(m.lahanId) : null;
              return `
        <div class="list-item">
          <div class="list-item-main">
            <div class="list-item-title">${escapeHtml(a.jenis)}</div>
            <div class="list-item-sub">${formatTanggal(a.tanggal)} · ${l ? escapeHtml(l.nama) : "-"}${a.sarana ? " · " + escapeHtml(a.sarana) + (a.jumlah ? " " + a.jumlah + " " + escapeHtml(a.satuan) : "") : ""}</div>
          </div>
          <div class="list-item-amount expense">${formatRupiah(a.nominal)}</div>
        </div>`;
            })
            .join("");
        }
      }

      // ============ MUSIM SWITCHER ============
      function openMusimSwitcher() {
        const lahanList = getLahanList();
        if (lahanList.length === 0) {
          showToast("Belum ada lahan", "error");
          return;
        }
        const aktifSekarang = getActiveMusim();
        const rows = lahanList
          .map((l) => {
            const aktif = state.data.musimTanam.find(
              (m) => m.lahanId === l.id && m.status === "aktif",
            );
            if (!aktif) {
              return `
        <button type="button" class="musim-option" onclick="buatMusimDariSwitcher(${l.id})">
          <span class="musim-option-main">
            <span class="musim-option-name">${escapeHtml(l.nama)}</span>
            <span class="musim-option-sub">Belum ada musim aktif</span>
          </span>
          <span class="musim-option-action">+ Buat</span>
        </button>`;
            }
            const isCurrent = aktifSekarang && aktif.id === aktifSekarang.id;
            return `
      <button type="button" class="musim-option ${isCurrent ? "selected" : ""}" onclick="pilihMusimAktif(${aktif.id})">
        <span class="musim-option-main">
          <span class="musim-option-name">${escapeHtml(l.nama)}</span>
          <span class="musim-option-sub">${escapeHtml(aktif.komoditas)} · mulai ${formatTanggal(aktif.tglMulai)}</span>
        </span>
        <span class="musim-option-check">${isCurrent ? "✓" : "›"}</span>
      </button>`;

          .join("");
        openModal(
          "Pilih Lahan &amp; Musim Aktif",
          `
    <div class="musim-option-list">${rows}</div>
    <p class="musim-option-note">Data di Home (biaya, panen, laba) mengikuti musim yang dipilih.</p>`,
        );
      }

      function pilihMusimAktif(musimId) {
        const m = getMusimById(musimId);
        if (!m) return;
        state.selectedMusimId = musimId;
        try {
          localStorage.setItem("taniku_active_musim", String(musimId));
        } catch (e) {}
        closeModal();
        renderHome();
        const l = getLahanById(m.lahanId);
        showToast(
          "Musim aktif: " + m.komoditas + (l ? " · " + l.nama : ""),
          "success",
        );
      }

      function buatMusimDariSwitcher(lahanId) {
        closeModal();
        openMusimModal(lahanId);
      }

      function resetSelectedMusim(musimIds) {
        if (musimIds.includes(state.selectedMusimId)) {
          state.selectedMusimId = null;
          try {
            localStorage.removeItem("taniku_active_musim");
          } catch (e) {}
        }
      }

      // ============ RENDER: LAHAN ============
      function renderLahan() {
        const lahanList = getLahanList();
        const el = document.getElementById("lahanList");
        if (lahanList.length === 0) {

            return `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
          <div>

            : `<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">Belum ada aktivitas tercatat.<br>Tap "+ Catat" untuk mulai.</div></div>`;

          .map((a) => {

        const lahanId = getFilterLahan("panen");

          ? semua.filter((p) => {
              const m = getMusimById(p.musimId);
              return m && m.lahanId === lahanId;
            })

        renderFilterLahanInfo(
          "panen",
          "panenFilterInfo",
          lahanId,

            : `<div class="empty-state"><div class="empty-icon">🌾</div><div class="empty-text">Belum ada panen tercatat.<br>Tap "+ Catat" untuk mulai.</div></div>`;

          <div class="list-item-amount income">${formatRupiah(total)}</div>
